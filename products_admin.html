<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products Management</title>
    <link
      href="assets/img/Department_of_Agriculture_of_the_Philippines.svg.png"
      rel="icon"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f5f5;
      }

      /* SIDEBAR */
      .sidebar {
        height: 100vh;
        background: #2f4f1f;
        color: white;
        position: fixed;
        width: 240px;
        padding: 25px;
        transition: 0.3s;
        z-index: 1000;
      }

      .sidebar a {
        display: block;
        color: white;
        margin: 15px 0;
        text-decoration: none;
      }

      /* ✅ OVERLAY ADDED */
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        display: none;
        z-index: 999;
      }

      #overlay.active {
        display: block;
      }

      /* MAIN */
      .main {
        margin-left: 240px;
        padding: 40px;
        transition: 0.3s;
      }

      .btn-green {
        background: #2f4f1f;
        color: white;
      }
      .btn-green:hover {
        background: #3d6b28;
      }

      .card-box {
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      .text-truncate-custom {
        max-width: 250px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      td {
        word-break: break-word;
      }

      .mobile-cards {
        display: none;
      }

      .toast-custom {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 16px;
        border-radius: 10px;
        color: white;
        transform: translateX(120%);
        opacity: 0;
        transition: 0.4s;
      }

      .toast-show {
        transform: translateX(0);
        opacity: 1;
      }
      .toast-success {
        background: #28a745;
      }
      .toast-delete {
        background: #dc3545;
      }
      .toast-error {
        background: #ffc107;
        color: black;
      }

      /* 📱 RESPONSIVE */
      @media (max-width: 768px) {
        .sidebar {
          left: -240px;
        }

        .sidebar.active {
          left: 0;
        }

        .main {
          margin-left: 0;
          padding: 20px;
        }

        .table-responsive {
          display: none;
        }

        .mobile-cards {
          display: block;
        }

        .mobile-card {
          background: white;
          border-radius: 10px;
          padding: 15px;
          margin-bottom: 15px;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .mobile-card img {
          width: 100%;
          border-radius: 8px;
          margin-bottom: 10px;
        }

        .mobile-card button {
          width: 100%;
          margin-top: 5px;
        }

        .header-flex {
          flex-direction: column;
          align-items: stretch !important;
        }

        .header-flex button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div id="toast" class="toast-custom"></div>

    <!-- ✅ OVERLAY -->
    <div id="overlay" onclick="closeSidebar()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <!-- ✅ HEADER WITH CLOSE BUTTON -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Admin Panel</h4>
        <button
          class="btn btn-sm btn-light d-md-none"
          onclick="toggleSidebar()"
        >
          ✖
        </button>
      </div>

      <!-- ✅ AUTO CLOSE ON CLICK -->
      <a href="admin.html" onclick="closeSidebar()">Dashboard</a>
      <a href="hero.html" onclick="closeSidebar()">Hero</a>
      <a href="products_admin.html" onclick="closeSidebar()">Products</a>
      <a href="achievements_admin.html" onclick="closeSidebar()"
        >Achievements</a
      >
      <a href="#" class="text-danger" onclick="logout()">Logout</a>
    </div>

    <!-- MAIN -->
    <div class="main">
      <button class="btn btn-dark d-md-none mb-3" onclick="toggleSidebar()">
        ☰ Menu
      </button>

      <div class="d-flex justify-content-between mb-4 header-flex">
        <h2>Products Management</h2>
        <button class="btn btn-green" onclick="openCreate()">
          + Add New Products
        </button>
      </div>

      <div class="card p-3 card-box">
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th class="text-start">Title</th>
                <th class="text-start">Description</th>
                <th class="text-center">Image</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody id="productTable"></tbody>
          </table>
        </div>

        <div id="mobileView" class="mobile-cards"></div>
      </div>
    </div>

    <!-- MODAL (UNCHANGED) -->
    <div class="modal fade" id="productModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5>Create Product</h5>
          </div>

          <div class="modal-body">
            <input
              id="titleInput"
              class="form-control mb-2"
              placeholder="Title"
            />
            <textarea
              id="descInput"
              class="form-control mb-2"
              placeholder="Description"
            ></textarea>
            <input type="file" id="imageInput" class="form-control" />
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-green" onclick="saveProduct()">Save</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      let products = [];
      let editIndex = null;

      const modal = new bootstrap.Modal(
        document.getElementById("productModal"),
      );

      function shortText(text, max = 60) {
        return text.length > max ? text.substring(0, max) + "..." : text;
      }

      function renderTable() {
        const table = document.getElementById("productTable");
        const mobile = document.getElementById("mobileView");

        table.innerHTML = "";
        mobile.innerHTML = "";

        products.forEach((p, i) => {
          table.innerHTML += `
            <tr>
              <td class="text-start"><strong>${p.title}</strong></td>
              <td class="text-start text-truncate-custom">${shortText(p.desc)}</td>
              <td class="text-center"><img src="${p.image}" width="80"></td>
              <td class="text-center">
                <button class="btn btn-success btn-sm" onclick="editProduct(${i})">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteProduct(${i})">Delete</button>
              </td>
            </tr>
          `;

          mobile.innerHTML += `
            <div class="mobile-card">
              <img src="${p.image}">
              <h5>${p.title}</h5>
              <p>${shortText(p.desc)}</p>
              <button class="btn btn-success btn-sm" onclick="editProduct(${i})">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteProduct(${i})">Delete</button>
            </div>
          `;
        });
      }

      function openCreate() {
        editIndex = null;
        titleInput.value = "";
        descInput.value = "";
        imageInput.value = "";
        modal.show();
      }

      function saveProduct() {
        const title = titleInput.value.trim();
        const desc = descInput.value.trim();
        const file = imageInput.files[0];

        if (!title || !desc) return showToast("Fill all fields", "error");

        const reader = new FileReader();
        reader.onload = (e) => {
          if (editIndex === null) {
            products.push({ title, desc, image: e.target.result });
          } else {
            products[editIndex] = { title, desc, image: e.target.result };
          }

          renderTable();
          modal.hide();
          showToast("Product Added Successfully!", "success");
        };

        reader.readAsDataURL(file);
      }

      function editProduct(i) {
        editIndex = i;
        titleInput.value = products[i].title;
        descInput.value = products[i].desc;
        modal.show();
      }

      function deleteProduct(i) {
        products.splice(i, 1);
        renderTable();
        showToast("Deleted", "delete");
      }

      /* ✅ UPDATED SIDEBAR CONTROL */
      function toggleSidebar() {
        document.querySelector(".sidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
      }

      function closeSidebar() {
        document.querySelector(".sidebar").classList.remove("active");
        document.getElementById("overlay").classList.remove("active");
      }

      function showToast(msg, type) {
        const t = document.getElementById("toast");
        t.className = "toast-custom";

        if (type === "success") t.classList.add("toast-success");
        else if (type === "delete") t.classList.add("toast-delete");
        else t.classList.add("toast-error");

        t.innerText = msg;
        setTimeout(() => t.classList.add("toast-show"), 50);
        setTimeout(() => t.classList.remove("toast-show"), 2000);
      }

      function logout() {
        localStorage.removeItem("isLoggedIn");
        location.href = "login.html";
      }
    </script>
  </body>
</html>
