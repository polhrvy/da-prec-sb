<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products Management</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- 🔐 LOGIN CHECK -->
    <script>
      if (localStorage.getItem("isLoggedIn") !== "true") {
        window.location.href = "login.html";
      }
    </script>

    <style>
      body {
        background: #f5f5f5;
      }

      .sidebar {
        height: 100vh;
        background: #2f4f1f;
        color: white;
        position: fixed;
        width: 240px;
        padding: 25px;
      }

      .sidebar a {
        display: block;
        color: white;
        margin: 15px 0;
        text-decoration: none;
      }

      .main {
        margin-left: 240px;
        padding: 40px;
      }

      .btn-green {
        background: #2f4f1f;
        color: white;
      }

      .btn-green:hover {
        background: #3d6b28;
      }

      .card-box {
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>

  <body>
    <!-- SIDEBAR -->
    <div class="sidebar">
      <h4>Admin Panel</h4>
      <a href="admin.html">Dashboard</a>
      <a href="hero.html">Hero</a>
      <a href="products_admin.html">Products</a>
      <a href="achievements_admin.html">Achievements</a>
      <a href="#" class="text-danger" onclick="logout()">Logout</a>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="d-flex justify-content-between mb-4">
        <h2>Products Management</h2>
        <button class="btn btn-green" onclick="openCreate()">
          + Create New Product
        </button>
      </div>

      <div class="card card-box p-3">
        <table class="table text-center align-middle">
          <thead>
            <tr>
              <th>Title</th>
              <th>Description</th>
              <th>Image</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="productTable"></tbody>
        </table>
      </div>
    </div>

    <!-- CREATE / EDIT MODAL -->
    <div class="modal fade" id="productModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="modalTitle">Create Product</h5>
          </div>

          <div class="modal-body">
            <input
              type="text"
              id="titleInput"
              class="form-control mb-2"
              placeholder="Product Title"
            />
            <textarea
              id="descInput"
              class="form-control mb-2"
              placeholder="Description"
            ></textarea>
            <input type="file" id="imageInput" class="form-control" />
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-green" onclick="saveProduct()">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- DELETE MODAL -->
    <div class="modal fade" id="deleteModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5>Enter Password to Delete</h5>
          </div>

          <div class="modal-body">
            <input
              type="password"
              id="deletePassword"
              class="form-control"
              placeholder="Enter password"
            />
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-danger" onclick="confirmDelete()">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 🔓 LOGOUT FUNCTION -->
    <script>
      function logout() {
        localStorage.removeItem("isLoggedIn");
        window.location.href = "login.html";
      }
    </script>

    <script>
      let products = [];
      let editIndex = null;
      let deleteIndex = null;

      const modal = new bootstrap.Modal(
        document.getElementById("productModal"),
      );
      const deleteModal = new bootstrap.Modal(
        document.getElementById("deleteModal"),
      );

      function renderTable() {
        const table = document.getElementById("productTable");
        table.innerHTML = "";

        products.forEach((p, index) => {
          table.innerHTML += `
          <tr>
            <td><strong>${p.title}</strong></td>
            <td>${p.desc}</td>
            <td><img src="${p.image}" width="100"></td>
            <td>
              <button class="btn btn-sm btn-success" onclick="editProduct(${index})">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="askDelete(${index})">Delete</button>
            </td>
          </tr>
        `;
        });
      }

      function openCreate() {
        editIndex = null;
        titleInput.value = "";
        descInput.value = "";
        imageInput.value = "";
        modalTitle.innerText = "Create Product";
        modal.show();
      }

      function saveProduct() {
        const title = titleInput.value;
        const desc = descInput.value;
        const file = imageInput.files[0];

        if (!title || !desc) return alert("All fields required");

        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            const img = e.target.result;

            if (editIndex === null) {
              products.push({ title, desc, image: img });
            } else {
              products[editIndex] = { title, desc, image: img };
            }

            renderTable();
            modal.hide();
          };
          reader.readAsDataURL(file);
        } else {
          alert("Image required");
        }
      }

      function editProduct(index) {
        editIndex = index;
        titleInput.value = products[index].title;
        descInput.value = products[index].desc;
        modalTitle.innerText = "Edit Product";
        modal.show();
      }

      function askDelete(index) {
        deleteIndex = index;
        deletePassword.value = "";
        deleteModal.show();
      }

      function confirmDelete() {
        const password = deletePassword.value;

        if (password === "admin123") {
          products.splice(deleteIndex, 1);
          renderTable();
          deleteModal.hide();
        } else {
          alert("Wrong password!");
        }
      }
    </script>
  </body>
</html>
