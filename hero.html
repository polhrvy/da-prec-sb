<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Management</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- 🔐 LOGIN CHECK -->
    <script>
      if (localStorage.getItem("isLoggedIn") !== "true") {
        window.location.href = "login.html";
      }
    </script>

    <style>
      body {
        background: #f5f5f5;
      }

      .sidebar {
        height: 100vh;
        background: #2f4f1f;
        color: white;
        position: fixed;
        width: 240px;
        padding: 25px;
      }

      .sidebar a {
        display: block;
        color: white;
        margin: 15px 0;
        text-decoration: none;
      }

      .main {
        margin-left: 240px;
        padding: 40px;
      }

      .btn-green {
        background: #2f4f1f;
        color: white;
      }

      .btn-green:hover {
        background: #3d6b28;
      }

      .card-box {
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      /* 🔔 TOAST */
      .toast-custom {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 16px 22px;
        border-radius: 12px;
        color: white;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 10px;
        backdrop-filter: blur(10px);
        transform: translateX(120%) scale(0.9);
        opacity: 0;
        transition: all 0.4s ease;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        z-index: 9999;
      }

      .toast-show {
        transform: translateX(0) scale(1);
        opacity: 1;
      }

      .toast-success {
        background: rgba(40, 167, 69, 0.95);
      }

      .toast-delete {
        background: rgba(220, 53, 69, 0.95);
      }

      .toast-error {
        background: rgba(255, 193, 7, 0.95);
        color: black;
      }
    </style>
  </head>

  <body>
    <!-- 🔔 TOAST -->
    <div id="toast" class="toast-custom"></div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <h4>Admin Panel</h4>
      <a href="admin.html">Dashboard</a>
      <a href="hero.html">Hero</a>
      <a href="products_admin.html">Products</a>
      <a href="achievements_admin.html">Achievements</a>
      <a href="#" onclick="logout()" class="text-danger">Logout</a>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="d-flex justify-content-between mb-4">
        <h2>Hero Management</h2>
        <button class="btn btn-green" onclick="openCreate()">
          + Create New Hero
        </button>
      </div>

      <div class="card card-box p-3">
        <table class="table text-center align-middle">
          <thead>
            <tr>
              <th>Image</th>
              <th>Description</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="heroTable"></tbody>
        </table>
      </div>
    </div>

    <!-- CREATE MODAL -->
    <div class="modal fade" id="heroModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="modalTitle">Create Hero</h5>
          </div>

          <div class="modal-body">
            <input type="file" id="imageInput" class="form-control mb-3" />
            <textarea
              id="descInput"
              class="form-control"
              placeholder="Description"
            ></textarea>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-green" onclick="saveHero()">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- DELETE MODAL -->
    <div class="modal fade" id="deleteModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5>Enter Password to Delete</h5>
          </div>

          <div class="modal-body">
            <input
              type="password"
              id="deletePassword"
              class="form-control mb-2"
              placeholder="Enter password"
            />

            <!-- 👁️ SHOW PASSWORD -->
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                onclick="toggleDeletePassword()"
              />
              <label class="form-check-label">Show Password</label>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-danger" onclick="confirmDelete()">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 🔓 LOGOUT -->
    <script>
      function logout() {
        localStorage.removeItem("isLoggedIn");
        window.location.href = "login.html";
      }
    </script>

    <script>
      let heroes = [];
      let editIndex = null;
      let deleteIndex = null;

      const modal = new bootstrap.Modal(document.getElementById("heroModal"));
      const deleteModal = new bootstrap.Modal(
        document.getElementById("deleteModal"),
      );

      function renderTable() {
        const table = document.getElementById("heroTable");
        table.innerHTML = "";

        heroes.forEach((hero, index) => {
          table.innerHTML += `
            <tr>
              <td><img src="${hero.image}" width="100"></td>
              <td>${hero.desc}</td>
              <td>
                <button class="btn btn-sm btn-success" onclick="editHero(${index})">Edit</button>
                <button class="btn btn-sm btn-danger" onclick="askDelete(${index})">Delete</button>
              </td>
            </tr>
          `;
        });
      }

      function openCreate() {
        editIndex = null;
        descInput.value = "";
        imageInput.value = "";
        modalTitle.innerText = "Create Hero";
        modal.show();
      }

      function saveHero() {
        const file = imageInput.files[0];
        const desc = descInput.value;

        if (!desc) {
          showToast("Description required!", "error");
          return;
        }

        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            const img = e.target.result;

            if (editIndex === null) {
              heroes.push({ image: img, desc });
              showToast("Hero successfully created!", "success");
            } else {
              heroes[editIndex] = { image: img, desc };
              showToast("Hero updated!", "success");
            }

            renderTable();
            modal.hide();
          };
          reader.readAsDataURL(file);
        } else {
          showToast("Image required!", "error");
        }
      }

      function editHero(index) {
        editIndex = index;
        descInput.value = heroes[index].desc;
        modalTitle.innerText = "Edit Hero";
        modal.show();
      }

      function askDelete(index) {
        deleteIndex = index;
        deletePassword.value = "";
        deleteModal.show();
      }

      function confirmDelete() {
        const password = deletePassword.value;

        if (password === "admin123") {
          heroes.splice(deleteIndex, 1);
          renderTable();
          deleteModal.hide();
          showToast("Hero successfully deleted!", "delete");
        } else {
          showToast("Wrong password!", "error");
        }
      }

      function toggleDeletePassword() {
        const input = document.getElementById("deletePassword");
        input.type = input.type === "password" ? "text" : "password";
      }

      function showToast(message, type) {
        const toast = document.getElementById("toast");

        toast.className = "toast-custom";

        if (type === "success") toast.classList.add("toast-success");
        else if (type === "delete") toast.classList.add("toast-delete");
        else toast.classList.add("toast-error");

        toast.innerHTML =
          (type === "success" ? "✅" : type === "delete" ? "🗑️" : "⚠️") +
          " " +
          message;

        setTimeout(() => toast.classList.add("toast-show"), 50);

        setTimeout(() => {
          toast.classList.remove("toast-show");
        }, 2500);
      }
    </script>
  </body>
</html>
