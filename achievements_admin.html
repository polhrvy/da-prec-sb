<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Achievements Management</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- 🔐 LOGIN CHECK -->
    <script>
      if (localStorage.getItem("isLoggedIn") !== "true") {
        window.location.href = "login.html";
      }
    </script>

    <style>
      body {
        background: #f5f5f5;
      }

      /* SIDEBAR */
      .sidebar {
        height: 100vh;
        background: #2f4f1f;
        color: white;
        position: fixed;
        width: 240px;
        padding: 25px;
        transition: 0.3s;
        z-index: 1000;
      }

      .sidebar a {
        display: block;
        color: white;
        margin: 15px 0;
        text-decoration: none;
      }

      /* OVERLAY */
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        display: none;
        z-index: 999;
      }

      #overlay.active {
        display: block;
      }

      /* MAIN CONTENT */
      .main {
        margin-left: 240px;
        padding: 40px;
        transition: 0.3s;
      }

      .btn-green {
        background: #2f4f1f;
        color: white;
      }
      .btn-green:hover {
        background: #3d6b28;
      }

      .card-box {
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      /* MOBILE CARDS */
      .mobile-cards {
        display: none;
      }
      .mobile-card {
        background: white;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 15px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      .mobile-card img {
        width: 100%;
        border-radius: 8px;
        margin-bottom: 10px;
      }
      .mobile-card button {
        width: 100%;
        margin-top: 5px;
      }

      /* TOASTS */
      .toast-custom {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 16px 22px;
        border-radius: 12px;
        color: white;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 10px;
        backdrop-filter: blur(10px);
        transform: translateX(120%) scale(0.9);
        opacity: 0;
        transition: all 0.4s ease;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        z-index: 9999;
      }
      .toast-show {
        transform: translateX(0) scale(1);
        opacity: 1;
      }
      .toast-success {
        background: rgba(40, 167, 69, 0.95);
      }
      .toast-delete {
        background: rgba(220, 53, 69, 0.95);
      }
      .toast-error {
        background: rgba(255, 193, 7, 0.95);
        color: black;
      }

      /* RESPONSIVE */
      @media (max-width: 768px) {
        .sidebar {
          left: -240px;
        }
        .sidebar.active {
          left: 0;
        }
        .main {
          margin-left: 0;
          padding: 20px;
        }
        .table-responsive {
          display: none;
        }
        .mobile-cards {
          display: block;
        }
        .header-flex {
          flex-direction: column;
          align-items: stretch !important;
        }
        .header-flex button {
          width: 100%;
          margin-top: 10px;
        }
      }
    </style>
  </head>

  <body>
    <!-- TOAST -->
    <div id="toast" class="toast-custom"></div>

    <!-- OVERLAY -->
    <div id="overlay" onclick="closeSidebar()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Admin Panel</h4>
        <button
          class="btn btn-sm btn-light d-md-none"
          onclick="toggleSidebar()"
        >
          ✖
        </button>
      </div>
      <a href="admin.html" onclick="closeSidebar()">Dashboard</a>
      <a href="hero.html" onclick="closeSidebar()">Hero</a>
      <a href="products_admin.html" onclick="closeSidebar()">Products</a>
      <a href="achievements_admin.html" onclick="closeSidebar()"
        >Achievements</a
      >
      <a href="#" class="text-danger" onclick="logout()">Logout</a>
    </div>

    <!-- MAIN -->
    <div class="main">
      <button class="btn btn-dark d-md-none mb-3" onclick="toggleSidebar()">
        ☰ Menu
      </button>

      <div class="d-flex justify-content-between mb-4 header-flex">
        <h2>Achievements Management</h2>
        <button class="btn btn-green" onclick="openCreate()">
          + Add New Achievement
        </button>
      </div>

      <div class="card p-3 card-box">
        <div class="table-responsive">
          <table class="table text-center align-middle">
            <thead>
              <tr>
                <th>Title</th>
                <th>Date</th>
                <th>Description</th>
                <th>Image</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="achievementTable"></tbody>
          </table>
        </div>
        <div id="mobileView" class="mobile-cards"></div>
      </div>
    </div>

    <!-- CREATE MODAL -->
    <div class="modal fade" id="achievementModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="modalTitle">Create Achievement</h5>
          </div>
          <div class="modal-body">
            <input
              type="text"
              id="titleInput"
              class="form-control mb-2"
              placeholder="Title"
            />
            <input type="date" id="dateInput" class="form-control mb-2" />
            <textarea
              id="descInput"
              class="form-control mb-2"
              placeholder="Description"
            ></textarea>
            <input type="file" id="imageInput" class="form-control" />
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-green" onclick="saveAchievement()">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- DELETE MODAL -->
    <div class="modal fade" id="deleteModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header"><h5>Enter Password to Delete</h5></div>
          <div class="modal-body">
            <input
              type="password"
              id="deletePassword"
              class="form-control mb-2"
              placeholder="Enter password"
              onkeydown="
                if (event.key === 'Enter') {
                  event.preventDefault();
                  confirmDelete();
                }
              "
            />
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                onclick="toggleDeletePassword()"
              />
              <label class="form-check-label">Show Password</label>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-danger" onclick="confirmDelete()">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // LOGOUT
      function logout() {
        showToast("✅ Logged out successfully!", "success");
        setTimeout(() => {
          localStorage.removeItem("isLoggedIn");
          window.location.href = "login.html";
        }, 1200);
      }

      // SIDEBAR
      function toggleSidebar() {
        document.querySelector(".sidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
      }
      function closeSidebar() {
        document.querySelector(".sidebar").classList.remove("active");
        document.getElementById("overlay").classList.remove("active");
      }

      // ACHIEVEMENTS
      let achievements = [];
      let editIndex = null;
      let deleteIndex = null;

      const modal = new bootstrap.Modal(
        document.getElementById("achievementModal"),
      );
      const deleteModal = new bootstrap.Modal(
        document.getElementById("deleteModal"),
      );

      function renderTable() {
        const table = document.getElementById("achievementTable");
        const mobile = document.getElementById("mobileView");
        table.innerHTML = "";
        mobile.innerHTML = "";

        achievements.forEach((a, i) => {
          table.innerHTML += `
            <tr>
              <td><strong>${a.title}</strong></td>
              <td>${a.date}</td>
              <td>${a.desc}</td>
              <td><img src="${a.image}" width="100"></td>
              <td>
                <button class="btn btn-sm btn-success" onclick="editAchievement(${i})">Edit</button>
                <button class="btn btn-sm btn-danger" onclick="askDelete(${i})">Delete</button>
              </td>
            </tr>
          `;

          mobile.innerHTML += `
            <div class="mobile-card">
              <img src="${a.image}" />
              <p><strong>${a.title}</strong> (${a.date})</p>
              <p>${a.desc}</p>
              <button class="btn btn-success btn-sm" onclick="editAchievement(${i})">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="askDelete(${i})">Delete</button>
            </div>
          `;
        });
      }

      function openCreate() {
        editIndex = null;
        titleInput.value = "";
        dateInput.value = "";
        descInput.value = "";
        imageInput.value = "";
        modalTitle.innerText = "Create Achievement";
        modal.show();
      }

      function saveAchievement() {
        const title = titleInput.value.trim();
        const date = dateInput.value.trim();
        const desc = descInput.value.trim();
        const file = imageInput.files[0];

        if (!title || !date || !desc)
          return showToast("All fields required!", "error");

        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            const img = e.target.result;
            if (editIndex === null) {
              achievements.push({ title, date, desc, image: img });
              showToast("✅ Achievement created!", "success");
            } else {
              achievements[editIndex] = { title, date, desc, image: img };
              showToast("✅ Achievement updated!", "success");
            }
            renderTable();
            modal.hide();
          };
          reader.readAsDataURL(file);
        } else {
          showToast("Image required!", "error");
        }
      }

      function editAchievement(i) {
        editIndex = i;
        titleInput.value = achievements[i].title;
        dateInput.value = achievements[i].date;
        descInput.value = achievements[i].desc;
        modalTitle.innerText = "Edit Achievement";
        modal.show();
      }

      function askDelete(i) {
        deleteIndex = i;
        deletePassword.value = "";
        deleteModal.show();
        setTimeout(() => deletePassword.focus(), 300);
      }

      function confirmDelete() {
        if (deletePassword.value === "admin123") {
          achievements.splice(deleteIndex, 1);
          renderTable();
          deleteModal.hide();
          showToast("Achievement deleted!", "delete");
        } else {
          showToast("Wrong password!", "error");
        }
      }

      function toggleDeletePassword() {
        deletePassword.type =
          deletePassword.type === "password" ? "text" : "password";
      }

      function showToast(msg, type) {
        const t = document.getElementById("toast");
        t.className = "toast-custom";
        if (type === "success") t.classList.add("toast-success");
        else if (type === "delete") t.classList.add("toast-delete");
        else t.classList.add("toast-error");
        t.innerText = msg;
        setTimeout(() => t.classList.add("toast-show"), 50);
        setTimeout(() => t.classList.remove("toast-show"), 2500);
      }
    </script>
  </body>
</html>
