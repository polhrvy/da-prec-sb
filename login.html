<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #2f4f1f, #3d6b28);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .login-card {
        width: 360px;
        padding: 30px;
        border-radius: 15px;
        background: white;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        text-align: center;
        animation: fadeIn 0.6s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        width: 80px;
        margin-bottom: 10px;
      }

      .btn-green {
        background: #2f4f1f;
        color: white;
        transition: 0.3s;
      }

      .btn-green:hover {
        background: #3d6b28;
      }

      /* 🔔 TOAST */
      .toast-custom {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 16px 22px;
        border-radius: 12px;
        color: white;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 10px;
        backdrop-filter: blur(10px);
        transform: translateX(120%) scale(0.9);
        opacity: 0;
        transition: all 0.4s ease;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      .toast-show {
        transform: translateX(0) scale(1);
        opacity: 1;
      }

      .toast-success {
        background: rgba(40, 167, 69, 0.95);
      }

      .toast-error {
        background: rgba(220, 53, 69, 0.95);
      }

      .spinner-border-sm {
        width: 1rem;
        height: 1rem;
      }
    </style>
  </head>

  <body>
    <!-- 🔔 TOAST -->
    <div id="toast" class="toast-custom"></div>

    <div class="login-card">
      <img
        src="assets/img/Department_of_Agriculture_of_the_Philippines.svg.png"
        class="logo"
      />

      <h4 class="mb-3">Admin Login</h4>

      <!-- ✅ FORM ADDED -->
      <form id="loginForm">
        <input
          type="text"
          id="username"
          class="form-control mb-3"
          placeholder="Username"
        />

        <input
          type="password"
          id="password"
          class="form-control mb-2"
          placeholder="Password"
        />

        <div class="form-check mb-3 text-start">
          <input
            class="form-check-input"
            type="checkbox"
            onclick="togglePassword()"
          />
          <label class="form-check-label">Show Password</label>
        </div>

        <button id="loginBtn" type="submit" class="btn btn-green w-100">
          Login
        </button>
      </form>
    </div>

    <script>
      // ✅ HANDLE ENTER KEY SUBMIT
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault(); // prevent reload
          login();
        });

      function login() {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        const btn = document.getElementById("loginBtn");

        btn.innerHTML =
          '<span class="spinner-border spinner-border-sm"></span> Logging in...';
        btn.disabled = true;

        setTimeout(() => {
          if (user === "admin" && pass === "admin123") {
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("username", user);

            showToast("Login successful!", "success");

            setTimeout(() => {
              window.location.href = "admin.html";
            }, 1500);
          } else {
            showToast("Invalid username or password", "error");

            btn.innerHTML = "Login";
            btn.disabled = false;
          }
        }, 800);
      }

      function togglePassword() {
        const passInput = document.getElementById("password");
        passInput.type = passInput.type === "password" ? "text" : "password";
      }

      function showToast(message, type) {
        const toast = document.getElementById("toast");

        toast.className = "toast-custom";
        toast.classList.add(
          type === "success" ? "toast-success" : "toast-error",
        );

        toast.innerHTML = (type === "success" ? "✅" : "❌") + " " + message;

        setTimeout(() => toast.classList.add("toast-show"), 50);

        setTimeout(() => {
          toast.classList.remove("toast-show");
        }, 2500);
      }

      // ✅ SHOW LOGOUT MESSAGE
      const logoutMessage = localStorage.getItem("logoutMessage");

      if (logoutMessage) {
        showToast(logoutMessage, "success");
        localStorage.removeItem("logoutMessage");
      }
    </script>
  </body>
</html>
