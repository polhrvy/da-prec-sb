<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DA-PREC Admin Dashboard</title>
    <link
      href="assets/img/Department_of_Agriculture_of_the_Philippines.svg.png"
      rel="icon"
    />
    <link
      href="assets/img/Department_of_Agriculture_of_the_Philippines.svg.png"
      rel="apple-touch-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f5f5;
      }

      /* SIDEBAR */
      .sidebar {
        height: 100vh;
        background: #2f4f1f;
        color: white;
        position: fixed;
        width: 240px;
        padding: 25px;
        transition: 0.3s;
        z-index: 1000;
      }
      .sidebar a {
        display: block;
        color: white;
        text-decoration: none;
        margin: 15px 0;
      }
      .sidebar a:hover {
        opacity: 0.8;
      }

      /* OVERLAY FOR MOBILE */
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        display: none;
        z-index: 999;
      }
      #overlay.active {
        display: block;
      }

      /* MAIN CONTENT */
      .main {
        margin-left: 240px;
        padding: 40px;
        transition: 0.3s;
      }

      .admin-green {
        background: #2f4f1f;
        color: white;
      }
      .btn-admin {
        background: #2f4f1f;
        color: white;
        border: none;
      }
      .btn-admin:hover {
        background: #3d6b28;
      }
      .card-green {
        background: #2f4f1f;
        color: white;
      }

      /* RESPONSIVE */
      @media (max-width: 768px) {
        .sidebar {
          left: -240px;
          position: fixed;
        }
        .sidebar.active {
          left: 0;
        }
        .main {
          margin-left: 0;
          padding: 20px;
        }
        .row > .col-md-4 {
          margin-bottom: 15px;
        }
        .top-menu-btn {
          display: inline-block;
          margin-bottom: 15px;
        }
      }
    </style>

    <!-- 🔐 LOGIN CHECK -->
    <script>
      if (localStorage.getItem("isLoggedIn") !== "true")
        window.location.href = "login.html";
    </script>
  </head>

  <body>
    <!-- OVERLAY -->
    <div id="overlay" onclick="closeSidebar()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Admin Panel</h4>
        <button
          class="btn btn-sm btn-light d-md-none"
          onclick="toggleSidebar()"
        >
          ✖
        </button>
      </div>
      <a href="admin.html" onclick="closeSidebar()">Dashboard</a>
      <a href="hero.html" onclick="closeSidebar()">Hero</a>
      <a href="products_admin.html" onclick="closeSidebar()">Products</a>
      <a href="achievements_admin.html" onclick="closeSidebar()"
        >Achievements</a
      >
    </div>

    <!-- MAIN -->
    <div class="main">
      <button
        class="btn btn-dark top-menu-btn d-md-none"
        onclick="toggleSidebar()"
      >
        ☰ Menu
      </button>

      <!-- USER DROPDOWN -->
      <div class="d-flex justify-content-end mb-3">
        <div class="dropdown">
          <button
            class="btn btn-admin dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
          >
            👤 <span id="topUsername">Admin</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li class="dropdown-item-text">
              Logged in as: <strong id="dropdownUsername">Admin</strong>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <a class="dropdown-item text-danger" href="#" onclick="logout()"
                >Logout</a
              >
            </li>
          </ul>
        </div>
      </div>

      <h2 class="mb-4">DA-PREC Admin Dashboard</h2>

      <!-- DASHBOARD CARDS -->
      <div class="row mb-4">
        <div class="col-md-4">
          <div class="card card-green p-3">
            <h6>Total Hero</h6>
            <h2>5</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card card-green p-3">
            <h6>Total Products</h6>
            <h2>7</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card card-green p-3">
            <h6>Total Achievements</h6>
            <h2>7</h2>
          </div>
        </div>
      </div>

      <!-- CHART SECTION -->
      <div class="card mt-4">
        <div class="card-header admin-green">System Overview Chart</div>
        <div class="card-body">
          <canvas id="adminChart" height="100"></canvas>
        </div>
      </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // SIDEBAR FUNCTIONS
      function toggleSidebar() {
        document.querySelector(".sidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
      }
      function closeSidebar() {
        document.querySelector(".sidebar").classList.remove("active");
        document.getElementById("overlay").classList.remove("active");
      }

      // LOGOUT
      function logout() {
        localStorage.removeItem("isLoggedIn");
        localStorage.removeItem("username");
        localStorage.setItem(
          "logoutMessage",
          "You have been logged out successfully.",
        );
        window.location.href = "login.html";
      }

      // LOAD USERNAME
      const username = localStorage.getItem("username") || "Admin";
      document.getElementById("topUsername").innerText = username;
      document.getElementById("dropdownUsername").innerText = username;

      // CHART
      const ctx = document.getElementById("adminChart").getContext("2d");
      const adminChart = new Chart(ctx, {
        type: "bar",
        data: {
          labels: ["Hero", "Products", "Achievements"],
          datasets: [
            {
              label: "Total Records",
              data: [5, 7, 7],
              backgroundColor: ["#3d6b28", "#3d6b28", "#3d6b28"],
            },
          ],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } },
        },
      });
    </script>
  </body>
</html>
