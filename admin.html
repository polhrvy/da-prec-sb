<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- 🔐 LOGIN CHECK -->
    <script>
      if (localStorage.getItem("isLoggedIn") !== "true") {
        window.location.href = "login.html";
      }
    </script>

    <style>
      body {
        background: #f5f5f5;
      }

      /* SIDEBAR */
      .sidebar {
        height: 100vh;
        background: #2f4f1f;
        color: white;
        position: fixed;
        width: 240px;
        padding: 25px;
      }

      .sidebar h4 {
        margin-bottom: 30px;
      }

      .sidebar a {
        display: block;
        color: white;
        text-decoration: none;
        margin: 15px 0;
      }

      .sidebar a:hover {
        opacity: 0.8;
      }

      /* MAIN */
      .main {
        margin-left: 240px;
        padding: 40px;
      }

      /* REUSABLE COLORS */
      .admin-green {
        background: #2f4f1f;
        color: white;
      }

      .btn-admin {
        background: #2f4f1f;
        color: white;
        border: none;
      }

      .btn-admin:hover {
        background: #3d6b28;
      }

      /* CARD STYLE */
      .card-green {
        background: #2f4f1f;
        color: white;
      }
    </style>
  </head>

  <body>
    <!-- SIDEBAR -->
    <div class="sidebar">
      <h4>Admin Panel</h4>

      <a href="admin.html">Dashboard</a>
      <a href="hero.html">Hero</a>
      <a href="products_admin.html">Products</a>
      <a href="achievements_admin.html">Achievements</a>
      <a href="#" class="text-danger" onclick="logout()">Logout</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main">
      <h2 class="mb-4">Admin Dashboard</h2>

      <!-- DASHBOARD CARDS -->
      <div class="row mb-4">
        <div class="col-md-4">
          <div class="card card-green p-3">
            <h6>Total Hero</h6>
            <h2>5</h2>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card card-green p-3">
            <h6>Total Products</h6>
            <h2>7</h2>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card card-green p-3">
            <h6>Total Achievements</h6>
            <h2>7</h2>
          </div>
        </div>
      </div>

      <!-- CHART SECTION -->
      <div class="card mt-4">
        <div class="card-header admin-green">System Overview Chart</div>

        <div class="card-body">
          <canvas id="adminChart" height="100"></canvas>
        </div>
      </div>
    </div>

    <!-- CHART JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 🔓 LOGOUT FUNCTION -->
    <script>
      function logout() {
        localStorage.removeItem("isLoggedIn");
        window.location.href = "login.html";
      }
    </script>

    <script>
      const ctx = document.getElementById("adminChart").getContext("2d");

      const adminChart = new Chart(ctx, {
        type: "bar",
        data: {
          labels: ["Hero", "Products", "Achievements"],
          datasets: [
            {
              label: "Total Records",
              data: [5, 7, 7],
              backgroundColor: ["#3d6b28", "#3d6b28", "#3d6b28"],
            },
          ],
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              display: false,
            },
          },
          scales: {
            y: {
              beginAtZero: true,
            },
          },
        },
      });
    </script>
  </body>
</html>
